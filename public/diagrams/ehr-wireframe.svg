<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" role="img" aria-label="Illustrative wireframe of a clinician web dashboard: sidebar navigation, header, summary cards, a chart, and a list. Not a real product screenshot.">
  <style>
    svg{--bg:#ffffff;--fg:#111827;--muted:#6b7280;--line:#cdd0d6;--panel:rgba(0,0,0,.03);--panel2:rgba(0,0,0,.055);--accent:#1d4ed8;}
    @media (prefers-color-scheme:dark){svg{--bg:#0c0c0d;--fg:#f0f0f0;--muted:#9ca3af;--line:#3f3f46;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.08);--accent:#60a5fa;}}
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .m{fill:var(--muted);}
    .win{fill:var(--panel);stroke:var(--line);stroke-width:1.25;}
    .card{fill:var(--panel2);stroke:var(--line);stroke-width:1;}
    .ln{stroke:var(--line);stroke-width:1;}
    .blk{fill:var(--line);}
  </style>
  <rect width="760" height="452" fill="var(--bg)"/>

  <!-- window -->
  <rect class="win" x="40" y="28" width="680" height="414" rx="12"/>
  <line class="ln" x1="40" y1="66" x2="720" y2="66"/>
  <circle class="blk" cx="64" cy="47" r="4" opacity=".7"/><circle class="blk" cx="80" cy="47" r="4" opacity=".7"/><circle class="blk" cx="96" cy="47" r="4" opacity=".7"/>
  <rect class="blk" x="124" y="39" width="380" height="16" rx="8" opacity=".4"/>

  <!-- sidebar -->
  <rect x="41" y="66" width="151" height="375" fill="var(--panel2)"/>
  <line class="ln" x1="192" y1="66" x2="192" y2="441"/>
  <rect x="58" y="82" width="18" height="18" rx="5" fill="var(--accent)" opacity=".85"/>
  <rect class="blk" x="84" y="86" width="72" height="10" rx="5" opacity=".55"/>
  <rect class="blk" x="58" y="126" width="116" height="10" rx="5" opacity=".5"/>
  <rect class="blk" x="58" y="160" width="116" height="10" rx="5" opacity=".5"/>
  <rect class="blk" x="58" y="194" width="116" height="10" rx="5" opacity=".5"/>
  <rect class="blk" x="58" y="228" width="116" height="10" rx="5" opacity=".5"/>
  <rect class="blk" x="58" y="262" width="116" height="10" rx="5" opacity=".5"/>

  <!-- header -->
  <rect class="blk" x="212" y="86" width="180" height="18" rx="5" opacity=".6"/>
  <rect class="card" x="590" y="82" width="80" height="24" rx="12"/>
  <circle class="card" cx="698" cy="94" r="13"/>

  <!-- KPI cards -->
  <rect class="card" x="212" y="126" width="150" height="72" rx="8"/>
  <rect class="blk" x="228" y="142" width="70" height="8" rx="4" opacity=".5"/>
  <rect class="blk" x="228" y="160" width="54" height="18" rx="4" opacity=".4"/>
  <rect class="card" x="378" y="126" width="150" height="72" rx="8"/>
  <rect class="blk" x="394" y="142" width="70" height="8" rx="4" opacity=".5"/>
  <rect class="blk" x="394" y="160" width="54" height="18" rx="4" opacity=".4"/>
  <rect class="card" x="544" y="126" width="150" height="72" rx="8"/>
  <rect class="blk" x="560" y="142" width="70" height="8" rx="4" opacity=".5"/>
  <rect class="blk" x="560" y="160" width="54" height="18" rx="4" opacity=".4"/>

  <!-- chart -->
  <rect class="card" x="212" y="218" width="300" height="156" rx="8"/>
  <rect class="blk" x="232" y="358" width="24" height="70" rx="3" opacity=".5" transform="translate(0,-70)"/>
  <rect class="blk" x="272" y="288" width="24" height="70" rx="3" opacity=".5"/>
  <rect class="blk" x="312" y="258" width="24" height="100" rx="3" opacity=".5"/>
  <rect class="blk" x="352" y="303" width="24" height="55" rx="3" opacity=".5"/>
  <rect class="blk" x="392" y="238" width="24" height="120" rx="3" opacity=".5"/>
  <rect class="blk" x="432" y="273" width="24" height="85" rx="3" opacity=".5"/>
  <rect class="blk" x="472" y="248" width="24" height="110" rx="3" opacity=".5"/>

  <!-- list -->
  <rect class="card" x="528" y="218" width="166" height="156" rx="8"/>
  <rect class="blk" x="544" y="238" width="134" height="9" rx="4" opacity=".45"/>
  <rect class="blk" x="544" y="264" width="134" height="9" rx="4" opacity=".45"/>
  <rect class="blk" x="544" y="290" width="134" height="9" rx="4" opacity=".45"/>
  <rect class="blk" x="544" y="316" width="134" height="9" rx="4" opacity=".45"/>
  <rect class="blk" x="544" y="342" width="100" height="9" rx="4" opacity=".45"/>

</svg>
