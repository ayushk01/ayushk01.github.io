<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" role="img" aria-label="Illustrative wireframe of a mobile app: header, a search bar, a scrollable list of rows with avatars, and a bottom tab bar. Not a real product screenshot.">
  <style>
    svg{--bg:#ffffff;--fg:#111827;--muted:#6b7280;--line:#cdd0d6;--panel:rgba(0,0,0,.03);--panel2:rgba(0,0,0,.055);--accent:#1d4ed8;}
    @media (prefers-color-scheme:dark){svg{--bg:#0c0c0d;--fg:#f0f0f0;--muted:#9ca3af;--line:#3f3f46;--panel:rgba(255,255,255,.04);--panel2:rgba(255,255,255,.08);--accent:#60a5fa;}}
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .m{fill:var(--muted);}
    .body{fill:var(--panel);stroke:var(--line);stroke-width:1.25;}
    .screen{fill:var(--panel2);stroke:var(--line);stroke-width:1;}
    .ln{stroke:var(--line);stroke-width:1;}
    .blk{fill:var(--line);}
  </style>
  <rect width="760" height="456" fill="var(--bg)"/>

  <!-- phone -->
  <rect class="body" x="300" y="24" width="160" height="420" rx="30"/>
  <rect class="screen" x="312" y="58" width="136" height="352" rx="10"/>
  <rect class="blk" x="356" y="32" width="48" height="10" rx="5" opacity=".7"/>

  <!-- header + search -->
  <rect class="blk" x="326" y="72" width="72" height="12" rx="4" opacity=".6"/>
  <rect class="blk" x="326" y="94" width="108" height="14" rx="7" opacity=".4"/>

  <!-- list rows -->
  <circle class="blk" cx="338" cy="136" r="13" opacity=".5"/>
  <rect class="blk" x="362" y="126" width="72" height="8" rx="4" opacity=".55"/>
  <rect class="blk" x="362" y="140" width="52" height="7" rx="4" opacity=".4"/>
  <circle class="blk" cx="338" cy="192" r="13" opacity=".5"/>
  <rect class="blk" x="362" y="182" width="72" height="8" rx="4" opacity=".55"/>
  <rect class="blk" x="362" y="196" width="52" height="7" rx="4" opacity=".4"/>
  <circle class="blk" cx="338" cy="248" r="13" opacity=".5"/>
  <rect class="blk" x="362" y="238" width="72" height="8" rx="4" opacity=".55"/>
  <rect class="blk" x="362" y="252" width="52" height="7" rx="4" opacity=".4"/>
  <circle class="blk" cx="338" cy="304" r="13" opacity=".5"/>
  <rect class="blk" x="362" y="294" width="72" height="8" rx="4" opacity=".55"/>
  <rect class="blk" x="362" y="308" width="52" height="7" rx="4" opacity=".4"/>

  <!-- tab bar -->
  <line class="ln" x1="312" y1="372" x2="448" y2="372"/>
  <circle class="blk" cx="345" cy="391" r="5" opacity=".55"/>
  <circle class="blk" cx="375" cy="391" r="5" opacity=".55"/>
  <circle class="blk" cx="405" cy="391" r="5" opacity=".55"/>
  <circle class="blk" cx="435" cy="391" r="5" opacity=".55"/>

</svg>
