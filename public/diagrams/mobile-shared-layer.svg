<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="Shared layer between web and mobile: Web (React) and Mobile (React Native) each keep their own UI components, but share a core of TypeScript types, a typed REST client, and the React Query data layer. The split happens at the navigation and feature-flag boundary.">
  <style>
    svg{--bg:#ffffff;--fg:#111827;--muted:#6b7280;--line:#d4d4d8;--panel:rgba(0,0,0,.035);--panel2:rgba(0,0,0,.06);--accent:#1d4ed8;}
    @media (prefers-color-scheme:dark){svg{--bg:#0c0c0d;--fg:#f0f0f0;--muted:#9ca3af;--line:#3f3f46;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--accent:#60a5fa;}}
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);}
    .m{fill:var(--muted);} .b{font-weight:600;}
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1.25;}
    .box2{fill:var(--panel2);stroke:var(--line);stroke-width:1;}
    .acbox{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;}
    .ln{stroke:var(--muted);stroke-width:1.4;fill:none;}
    .lf{fill:var(--muted);}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="lf"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="var(--bg)"/>

  <!-- web -->
  <rect class="box" x="96" y="40" width="236" height="92" rx="10"/>
  <text class="b" x="214" y="72" text-anchor="middle" font-size="15">Web</text>
  <text class="m" x="214" y="92" text-anchor="middle" font-size="12">React</text>
  <text class="m" x="214" y="110" text-anchor="middle" font-size="11">own UI components</text>
  <!-- mobile -->
  <rect class="box" x="428" y="40" width="236" height="92" rx="10"/>
  <text class="b" x="546" y="72" text-anchor="middle" font-size="15">Mobile</text>
  <text class="m" x="546" y="92" text-anchor="middle" font-size="12">React Native</text>
  <text class="m" x="546" y="110" text-anchor="middle" font-size="11">own UI components</text>

  <line class="ln" x1="214" y1="132" x2="214" y2="178" marker-end="url(#ar)"/>
  <line class="ln" x1="546" y1="132" x2="546" y2="178" marker-end="url(#ar)"/>

  <!-- shared core -->
  <rect class="acbox" x="96" y="180" width="568" height="120" rx="12"/>
  <text class="b" x="116" y="206" font-size="14">Shared core</text>
  <text class="m" x="644" y="206" text-anchor="end" font-size="11">split at navigation + feature-flag boundary</text>

  <rect class="box2" x="114" y="222" width="172" height="58" rx="8"/>
  <text x="200" y="248" text-anchor="middle" font-size="12.5">TypeScript</text>
  <text x="200" y="265" text-anchor="middle" font-size="12.5">types</text>
  <rect class="box2" x="302" y="222" width="172" height="58" rx="8"/>
  <text x="388" y="248" text-anchor="middle" font-size="12.5">Typed REST</text>
  <text x="388" y="265" text-anchor="middle" font-size="12.5">client</text>
  <rect class="box2" x="490" y="222" width="172" height="58" rx="8"/>
  <text x="576" y="248" text-anchor="middle" font-size="12.5">React Query</text>
  <text x="576" y="265" text-anchor="middle" font-size="12.5">data layer</text>

  <text class="m" x="380" y="338" text-anchor="middle" font-size="12">UI components stay separate per platform.</text>
</svg>
