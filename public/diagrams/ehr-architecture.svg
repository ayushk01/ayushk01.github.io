<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" role="img" aria-label="Multi-tenant architecture: one codebase resolves at request time through a multi-tenant layer (theming, auth scoping, feature flags) into branded per-tenant deployments, over tenant-isolated data, on AWS.">
  <style>
    svg{--bg:#ffffff;--fg:#111827;--muted:#6b7280;--line:#d4d4d8;--panel:rgba(0,0,0,.035);--panel2:rgba(0,0,0,.06);--accent:#1d4ed8;}
    @media (prefers-color-scheme:dark){svg{--bg:#0c0c0d;--fg:#f0f0f0;--muted:#9ca3af;--line:#3f3f46;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--accent:#60a5fa;}}
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--fg);}
    .m{fill:var(--muted);} .b{font-weight:600;}
    .box{fill:var(--panel);stroke:var(--line);stroke-width:1.25;}
    .box2{fill:var(--panel2);stroke:var(--line);stroke-width:1;}
    .acbox{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;}
    .ln{stroke:var(--muted);stroke-width:1.4;fill:none;}
    .lf{fill:var(--muted);}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="lf"/>
    </marker>
  </defs>
  <rect width="760" height="544" fill="var(--bg)"/>

  <!-- codebase -->
  <rect class="acbox" x="280" y="24" width="200" height="58" rx="10"/>
  <text class="b" x="380" y="50" text-anchor="middle" font-size="15">Single codebase</text>
  <text class="m" x="380" y="69" text-anchor="middle" font-size="12">React · TypeScript</text>
  <line class="ln" x1="380" y1="84" x2="380" y2="114" marker-end="url(#ar)"/>

  <!-- multi-tenant layer -->
  <rect class="acbox" x="64" y="116" width="632" height="104" rx="12"/>
  <text class="b" x="82" y="141" font-size="14">Multi-tenant layer</text>
  <text class="m" x="678" y="141" text-anchor="end" font-size="11">resolved at request time</text>
  <rect class="box2" x="82" y="154" width="190" height="50" rx="8"/>
  <text class="b" x="177" y="178" text-anchor="middle" font-size="13">Theming</text>
  <text class="m" x="177" y="194" text-anchor="middle" font-size="10.5">CSS vars, per tenant</text>
  <rect class="box2" x="285" y="154" width="190" height="50" rx="8"/>
  <text class="b" x="380" y="178" text-anchor="middle" font-size="13">Auth scoping</text>
  <text class="m" x="380" y="194" text-anchor="middle" font-size="10.5">tenant in every request</text>
  <rect class="box2" x="488" y="154" width="190" height="50" rx="8"/>
  <text class="b" x="583" y="178" text-anchor="middle" font-size="13">Feature flags</text>
  <text class="m" x="583" y="194" text-anchor="middle" font-size="10.5">per-tenant modules</text>

  <!-- split -->
  <line class="ln" x1="380" y1="220" x2="380" y2="250"/>
  <line class="ln" x1="160" y1="250" x2="600" y2="250"/>
  <line class="ln" x1="160" y1="250" x2="160" y2="284" marker-end="url(#ar)"/>
  <line class="ln" x1="380" y1="250" x2="380" y2="284" marker-end="url(#ar)"/>
  <line class="ln" x1="600" y1="250" x2="600" y2="284" marker-end="url(#ar)"/>

  <!-- tenant A -->
  <rect class="box" x="80" y="286" width="160" height="92" rx="10"/>
  <line class="ln" x1="80" y1="312" x2="240" y2="312" stroke-width="1"/>
  <circle class="lf" cx="96" cy="300" r="3"/><circle class="lf" cx="108" cy="300" r="3"/><circle class="lf" cx="120" cy="300" r="3"/>
  <text class="b" x="160" y="340" text-anchor="middle" font-size="13">Tenant A</text>
  <text class="m" x="160" y="358" text-anchor="middle" font-size="10.5">own theme + features</text>
  <!-- tenant B -->
  <rect class="box" x="300" y="286" width="160" height="92" rx="10"/>
  <line class="ln" x1="300" y1="312" x2="460" y2="312" stroke-width="1"/>
  <circle class="lf" cx="316" cy="300" r="3"/><circle class="lf" cx="328" cy="300" r="3"/><circle class="lf" cx="340" cy="300" r="3"/>
  <text class="b" x="380" y="340" text-anchor="middle" font-size="13">Tenant B</text>
  <text class="m" x="380" y="358" text-anchor="middle" font-size="10.5">own theme + features</text>
  <!-- tenant C -->
  <rect class="box" x="520" y="286" width="160" height="92" rx="10"/>
  <line class="ln" x1="520" y1="312" x2="680" y2="312" stroke-width="1"/>
  <circle class="lf" cx="536" cy="300" r="3"/><circle class="lf" cx="548" cy="300" r="3"/><circle class="lf" cx="560" cy="300" r="3"/>
  <text class="b" x="600" y="340" text-anchor="middle" font-size="13">Tenant C</text>
  <text class="m" x="600" y="358" text-anchor="middle" font-size="10.5">own theme + features</text>

  <!-- to data -->
  <line class="ln" x1="160" y1="378" x2="160" y2="408" marker-end="url(#ar)"/>
  <line class="ln" x1="380" y1="378" x2="380" y2="408" marker-end="url(#ar)"/>
  <line class="ln" x1="600" y1="378" x2="600" y2="408" marker-end="url(#ar)"/>

  <!-- isolated data -->
  <rect class="box" x="80" y="410" width="600" height="48" rx="10"/>
  <text class="b" x="380" y="432" text-anchor="middle" font-size="13">Tenant-isolated data</text>
  <text class="m" x="380" y="449" text-anchor="middle" font-size="10.5">each tenant's records logically separated</text>

  <line class="ln" x1="380" y1="458" x2="380" y2="470" marker-end="url(#ar)"/>

  <!-- aws -->
  <rect class="box2" x="80" y="472" width="600" height="56" rx="10"/>
  <text class="b" x="380" y="495" text-anchor="middle" font-size="13">AWS</text>
  <text class="m" x="380" y="514" text-anchor="middle" font-size="11">ECS · Lambda · Fargate · RDS · DynamoDB · S3 · CloudFront</text>
</svg>
